version: 3

output:
    ver-android/app/src/main/kotlin/org/opengamestudio/ignore.kd.kt:
        type: kotlin
    sdk-ios/gb/src/commonMain/kotlin/org/opengamestudio/ignore.kd.kt:
        type: kotlin
    ver-ios/src/ignore.kd.swift:
        type: swift

kotlin: package org.opengamestudio
swift: import gb

BudgetContext:
    type: context
    fields:
        didClickCopy: Bool
        didClickPasteMorningBalance: Bool
        didClickPasteSpent: Bool
        didLaunch: Bool
        didSetup: Bool
        inputDate: String
        inputMorningBalance: String
        inputSpent: String
        morningBalance: String
        pastedMorningBalance: String
        pastedSpent: String
        reportedDate: String
        reportedWeekday: Int
        result: String
        spent: String

NetRequest:
    type: struct
    fields:
        body: String
        method: String
        url: String

NetResponse:
    type: struct
    fields:
        contents: String
        req: NetRequest
