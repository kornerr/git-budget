version: 3

output:
    ver-android/app/src/main/kotlin/org/opengamestudio/ignore.kd.kt:
        type: kotlin
    sdk-ios/gb/src/commonMain/kotlin/org/opengamestudio/ignore.kd.kt:
        type: kotlin
    ver-ios/src/ignore.kd.swift:
        type: swift
    sdk-mac-x64/gb/src/nativeMain/kotlin/org/opengamestudio/ignore.kd.kt:
        type: c++sdk
    ver-mac-x64/src/ignore.kd.h:
        type: c++hdr
    ver-mac-x64/src/ignore.kd.cpp:
        type: c++src

c++sdk: package org.opengamestudio
c++sdk: import kotlinx.cinterop.*
kotlin: package org.opengamestudio
swift: import gb

BudgContext:
    type: context
    fields:
        dateBeforeReported: String
        didClickCommit: Bool
        didClickCopy: Bool
        didClickPasteMorningBalance: Bool
        didClickPasteSpent: Bool
        didClickPush: Bool
        didLaunch: Bool
        historyItems: [String: HistItem]
        inputDate: String
        inputMorningBalance: String
        inputSpent: String
        morningBalance: String
        pastedMorningBalance: String
        pastedSpent: String
        reportedDate: String
        reportedLeft: String
        reportedWeekday: Int
        result: String
        spent: String
        weekdayBeforeReported: Int

GitContext:
    type: context
    fields:
        clone: Bool
        cloneError: String
        commit: Bool
        commitError: String
        didClone: Bool
        didCommit: Bool
        didLaunch: Bool
        didPull: Bool
        didPush: Bool
        pull: Bool
        pullError: String
        push: Bool
        pushError: String
        repoDir: String
        repoDirExists: Bool
        repoURL: String
        rootDir: String

HistContext:
    type: context
    fields:
        didClone: Bool
        didLaunch: Bool
        didPull: Bool
        didRead: Bool
        didWrite: Bool
        fileLines: [String]
        items: [String: HistItem]
        loadedItems: [HistItem]
        read: Bool
        readError: String
        repoDir: String
        write: Bool
        writeError: String

HistItem:
    type: struct
    fields:
        dt: String
        left: Float
        spent: Float

MastContext:
    type: context
    fields:
        didClickBudgetTab: Bool
        didClickSettingsTab: Bool
        didLaunch: Bool
        didSetup: Bool
        isBudgetTabSelected: Bool
        isSettingsTabSelected: Bool
        logBudgetChange: String
        logGitChange: String
        logHistoryChange: String
        logs: [String]
