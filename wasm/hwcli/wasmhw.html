<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swift WebAssembly Demo</title>
</head>
<body>
  <h1>Swift + WebAssembly</h1>
  <p><b>stringValue:</b> <span id="sv"></span></p>
  <p><b>intValue:</b> <span id="iv"></span></p>

  <script>
    async function init() {
      const wasi = { wasi_snapshot_preview1: {
        args_get: () => 0, args_sizes_get: () => 0,
        environ_get: () => 0, environ_sizes_get: () => 0,
        fd_close: () => 0, fd_fdstat_get: () => 0,
        fd_prestat_get: () => 8, fd_prestat_dir_name: () => 8,
        fd_read: () => 0, fd_seek: () => 0, fd_write: () => 0,
        path_open: () => 8, proc_exit: () => {},
        random_get: () => 0,
      }};

      const { instance } = await WebAssembly.instantiateStreaming(fetch("hwcli.wasm"), wasi);
      const mem = () => new Uint8Array(instance.exports.memory.buffer);

      const readCStr = (p) => {
        const b = mem(); let e = p;
        while (b[e]) e++;
        return new TextDecoder().decode(b.slice(p, e));
      };

      const exports = instance.exports;

      const ctx = {
        get stringValue() { return readCStr(exports.get_string()); },
        set stringValue(v) {
          const enc = new TextEncoder().encode(v + "\0");
          const scratch = exports.get_scratch();
          const b = mem();
          for (let i = 0; i < enc.length; i++) b[scratch + i] = enc[i];
          exports.set_string(scratch);
        },
        get intValue() { return exports.get_int(); },
        set intValue(v) { exports.set_int(v); },
      };

      document.getElementById("sv").textContent = ctx.stringValue;
      document.getElementById("iv").textContent = ctx.intValue;
    }

    init().catch(e => document.body.innerHTML += `<p>Error: ${e.message}</p>`);
  </script>
</body>
</html>
